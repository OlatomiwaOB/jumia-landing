name: Deploy Next.js App (Docker + Runtime Env)

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd /opt/fortitude-direct 
            
            # Pull latest code
            git fetch origin
            git reset --hard origin/main
            
            # Stop and remove existing container
            docker stop nextjs-app || true
            docker rm nextjs-app || true
            
            # Build new Docker image
            docker build \
              --build-arg NEXT_PUBLIC_STORE_FRONT=${{ secrets.NEXT_PUBLIC_STORE_FRONT }} \
              --build-arg NEXT_PUBLIC_REACT_APP_API_URL=${{ secrets.NEXT_PUBLIC_REACT_APP_API_URL }} \
              --build-arg NEXT_PUBLIC_CLIENT_ID=${{ secrets.NEXT_PUBLIC_CLIENT_ID }} \
              --build-arg NEXT_PUBLIC_CLIENT_SECRET=${{ secrets.NEXT_PUBLIC_CLIENT_SECRET }} \
              --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }} \
              -t nextjs-app:latest .
            
            # Run container with network mode
            docker run -d \
              --name nextjs-app \
              --restart unless-stopped \
              --network host \
              nextjs-app:latest