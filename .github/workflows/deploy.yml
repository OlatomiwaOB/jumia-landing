name: Deploy Next.js App (Docker + Runtime Env)

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd /opt/ecommerce-app/Dimensionlogic-templates

            # Pull latest code
            git fetch origin
            git reset --hard origin/main

            # ── App 1 (port 3000) ──────────────────────────────────────────
            docker stop verisafoods || true
            docker rm verisafoods || true

            docker build \
              --build-arg NEXT_PUBLIC_STORE_FRONT=${{ secrets.NEXT_PUBLIC_STORE_FRONT }} \
              --build-arg NEXT_PUBLIC_REACT_APP_API_URL=${{ secrets.NEXT_PUBLIC_REACT_APP_API_URL }} \
              --build-arg NEXT_PUBLIC_SOURCE_CODE=${{ secrets.NEXT_PUBLIC_SOURCE_CODE }} \
              --build-arg NEXT_PUBLIC_CLIENT_ID=${{ secrets.NEXT_PUBLIC_CLIENT_ID }} \
              --build-arg NEXT_PUBLIC_CLIENT_SECRET=${{ secrets.NEXT_PUBLIC_CLIENT_SECRET }} \
              --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }} \
              -t verisafoods:latest . 2>&1

            docker run -d \
              --name verisafoods \
              --restart unless-stopped \
              -p 3000:3000 \
              verisafoods:latest

            # ── App 2 (port 3001) ──────────────────────────────────────────
            docker stop traditionaltastes || true
            docker rm traditionaltastes || true

            docker build \
              --build-arg NEXT_PUBLIC_STORE_FRONT=${{ secrets.NEXT_PUBLIC_STORE_FRONT_2 }} \
              --build-arg NEXT_PUBLIC_REACT_APP_API_URL=${{ secrets.NEXT_PUBLIC_REACT_APP_API_URL_2 }} \
              --build-arg NEXT_PUBLIC_SOURCE_CODE=${{ secrets.NEXT_PUBLIC_SOURCE_CODE_2 }} \
              --build-arg NEXT_PUBLIC_CLIENT_ID=${{ secrets.NEXT_PUBLIC_CLIENT_ID_2 }} \
              --build-arg NEXT_PUBLIC_CLIENT_SECRET=${{ secrets.NEXT_PUBLIC_CLIENT_SECRET_2 }} \
              --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY_2 }} \
              -t traditionaltastes:latest . 2>&1

            docker run -d \
              --name traditionaltastes \
              --restart unless-stopped \
              -p 3001:3000 \
              traditionaltastes:latest
